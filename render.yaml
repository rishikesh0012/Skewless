# Render Blueprint for the Skewless FastAPI backend.
# New → Blueprint in the Render dashboard, point at this repo, and Render
# builds the existing root `Dockerfile` as-is — no separate build config.
#
# CORS_ALLOWED_ORIGINS is intentionally left for manual entry (sync: false):
# it must point at the deployed frontend's URL, which only exists after the
# Vercel deploy. See the "Deploy" section in README.md for the full sequence.
services:
  - type: web
    name: skewless-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
