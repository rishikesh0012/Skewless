[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ml-skew"
version = "0.1.0"
description = "Training-serving feature parity and model monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=3.14,<4",
    "bentoml==1.4.39",
    "numpy>=2.0,<3",
    "joblib>=1.4,<2",
    "lightgbm>=4.6,<5",
    "pandas>=2.2,<4",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "scikit-learn>=1.6,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pandas-stubs>=2.2,<3",
    "mypy>=1.13,<2",
    "pytest>=9,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_skew"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ml_skew"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*"]
ignore_missing_imports = true
