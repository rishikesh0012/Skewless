[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skewless"
version = "1.0.0"
description = "Skewless — Training-Serving Feature Parity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.6,<5",
    "mlflow>=3.15,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pandera[pandas]>=0.20,<1",
    "pyarrow>=18,<24",
    "pydantic>=2.10,<3",
    "scikit-learn>=1.6,<2",
    "shap>=0.46,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.10,<3",
    "mypy>=1.13,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=9,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/features", "src/model", "src/api"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["features", "model", "api"]

[[tool.mypy.overrides]]
module = [
    "lightgbm",
    "lightgbm.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "joblib.*",
    "mlflow",
    "mlflow.*",
    "shap",
    "shap.*",
]
ignore_missing_imports = true
